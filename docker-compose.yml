# Copy apps/server/.env.example to .env next to this file and fill in APP_ORIGIN, SESSION_SECRET and VAULT_KEY.
# By default the server keeps SQLite in the pikibun-data volume and stores no session backups; to keep backups in that
# volume too, set STORAGE_URL=file:///data/backups in .env. The image lets workspace owners connect a Postgres database
# of their own for their backups; WORKSPACE_DATABASES=false in .env turns that off. It signs people in with a username
# and password, and takes new accounts only through a workspace's invite link (PASSWORD_AUTH=false, or SIGNUP=open or
# off, in .env change that). For its first administrator, set ADMIN_USER_IDS=password:admin in .env, start it and run:
#   docker compose exec pikibun node dist/server/main.js --create-admin admin
# To run a published image instead of building one, set PIKIBUN_IMAGE (such as ghcr.io/opencara/pikibun:latest) in .env
# and start it with `docker compose up -d --no-build`; the Deploy server workflow sets it on each release.
# For Postgres, run `docker compose --profile postgres up` and set in .env:
#   DATABASE_URL=postgres://pikibun:change-me@postgres:5432/pikibun
services:
  pikibun:
    build: .
    image: ${PIKIBUN_IMAGE:-pikibun}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      - pikibun-data:/data

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: pikibun
      POSTGRES_USER: pikibun
      POSTGRES_PASSWORD: change-me
    volumes:
      - pikibun-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikibun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pikibun-data:
  pikibun-postgres:
