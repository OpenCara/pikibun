name: CI
# Pull requests run it on their pushes, a merge queue on the merge it is about to make, main on each of its pushes (a pull
# request was checked against main as it was then, and two that passed alone can break it together), and version tags
# through their release workflow before publishing. Run it by hand (workflow_dispatch) for any branch.
#
# A pull request runs only what its changes need: one that changes only documentation (Markdown, docs/images, the licence)
# runs none of it, and the container image is built only when something it is built from changes. A release or a run
# by hand checks everything, as do main's pushes and the merge queue. `verify` is the one result to wait for, and the one main's
# ruleset requires: it passes once every job passed or was not needed.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A pull request's newer push cancels its run in progress; every other run (releases, by hand) has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      image: ${{ steps.paths.outputs.image }}
    steps:
      # A pull request's run checks out its merge into the base branch, whose first parent is the base it changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: What the changes need
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            { echo "code=true"; echo "image=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both paths of a renamed file: one moved out of what the image is built from changes the image too.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          # Anything but documentation (Markdown, docs/images, the licence) is code; an empty list counts as code, to be safe.
          code=false
          if [ ! -s "$RUNNER_TEMP/changed" ] || grep -qvE '(\.md$|^docs/images/|^LICENSE$)' "$RUNNER_TEMP/changed"; then code=true; fi
          # What the image is built from, as the Dockerfile copies it, and this workflow.
          image=false
          if grep -qE '^(Dockerfile|\.dockerignore|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|packages/cli/package\.json|apps/server/|apps/nsh/|packages/shared/|packages/client/|scripts/nsh\.mjs|scripts/nsh-web-fixes\.mjs|scripts/build-server\.mjs|\.github/workflows/ci\.yml)' "$RUNNER_TEMP/changed"; then image=true; fi
          { echo "code=$code"; echo "image=$image"; } >> "$GITHUB_OUTPUT"
          echo "Code: $code. Container image: $image."

  # Static checks: the connector's shrinkwrap, types (the apps' too) and the sandbox's Python programs.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Native Shell CLI the client (apps/nsh) is checked and built with, at the version scripts/nsh.mjs pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Connector shrinkwrap matches package.json
        run: node packages/cli/scripts/shrinkwrap.mjs --check
      # oxlint's correctness rules, as .oxlintrc.json sets them; any finding fails.
      - run: pnpm lint
      # Comments in sources and drifting pins, the most common failures: checked here as well as in the tests job, so they
      # fail within minutes. `pnpm check:fast` runs the same before a push.
      - run: pnpm check:comments
      - run: node --import tsx --test tests/pinned-dependencies.test.ts
      - run: pnpm typecheck
      # The sandbox's Python programs: Ruff and Pyright, from npm (embedded as checked by tests/sandbox-python.test.ts).
      - run: pnpm python:check

  # The tests and the end-to-end suite, in the Linux sandbox and against Postgres, split over parallel jobs: the tests
  # were one job of 8-11 minutes, the run's critical path (docs/design/ci-tests.md). Three shards share tests/*.test.ts
  # (Node's --test-shard takes every third file), and `sandbox` runs the sandboxes' shared cases and the end-to-end suite.
  # The two tests the `checks` job runs (no comments, pinned dependencies) aren't run again here.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: shard-1, shard: 1/3 }
          - { part: shard-2, shard: 2/3 }
          - { part: shard-3, shard: 3/3 }
          - { part: sandbox }
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 git util-linux ripgrep fd-find
      - name: Enable sandbox namespaces in the disposable CI VM
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --cap-drop ALL --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev -- /usr/bin/true
      - run: pnpm install --frozen-lockfile
      # The part's tests with Node's own coverage of apps, packages and extensions, as `pnpm test:coverage` runs them all:
      # each part's lcov goes to the `coverage` job, which merges them.
      - name: Tests with coverage
        env:
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
        run: |
          shard=""
          if [ "$PART" = sandbox ]; then
            files=tests/sandbox-conformance.test.ts
          else
            files=$(ls tests/*.test.ts | grep -vxE 'tests/(sandbox-conformance|no-comments|pinned-dependencies)\.test\.ts')
            shard="--test-shard=$SHARD"
          fi
          node --import tsx --test $shard --experimental-test-coverage --test-coverage-include='apps/**' \
            --test-coverage-include='packages/**' --test-coverage-include='extensions/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination="lcov-$PART.info" $files
      - name: MEASURE (temporary) the same tests without coverage
        env:
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
        run: |
          shard=""
          if [ "$PART" = sandbox ]; then
            files=tests/sandbox-conformance.test.ts
          else
            files=$(ls tests/*.test.ts | grep -vxE 'tests/(sandbox-conformance|no-comments|pinned-dependencies)\.test\.ts')
            shard="--test-shard=$SHARD"
          fi
          node --import tsx --test $shard --test-reporter=dot $files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov-${{ matrix.part }}
          path: lcov-${{ matrix.part }}.info
          if-no-files-found: ignore
          retention-days: 1
      - if: matrix.part == 'sandbox'
        run: pnpm test:connected

  # The test parts' coverage merged into one lcov.info: its table goes to the run's summary, and the file to an artifact
  # for editors and coverage services.
  coverage:
    needs: [changes, tests]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-lcov-*
          path: coverage
          merge-multiple: true
      - run: node scripts/merge-lcov.mjs lcov.info coverage/*.info
      - name: Coverage summary
        run: node scripts/coverage-summary.mjs lcov.info >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # The client on Native Shell and in a browser, the web build and the published CLI.
  client:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      # The client's tests, headless on Native Shell's own engine against a stubbed server.
      - run: pnpm test:client
      # The client in a terminal: Native Shell's terminal backend on an in-memory terminal, as @pikibun/tui runs it.
      - run: pnpm test:client-tui
      # Its Cell screenshots (UTF-8 JSON, one entry per Cell), to see the screens as a terminal draws them; only the
      # terminal run writes them, so none means the run didn't draw in a terminal.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tui-screens
          path: apps/nsh/.nsh/tui-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # @pikibun/tui for this runner (the app's bundle, the launcher and the linux-x64 host), then the packaged app in a
      # pseudo-terminal: a bundle the host can't load ends the run at once, where a working one keeps drawing until
      # timeout stops it (124). Its input stays open and silent (sleep), as a terminal nobody types in.
      - run: pnpm build:tui
      - name: The terminal app starts in a terminal and keeps running
        env:
          TERM: xterm-256color
        run: |
          export PIKIBUN_TUI_HOST="$PWD/packages/tui/dist/hosts/linux-x64/bin/nsh-tui-host"
          status=0
          sleep 20 | timeout 10 script -qefc "node packages/tui/dist/tui/bin/pikibun-tui.js --log-file $RUNNER_TEMP/tui.log --data-dir $RUNNER_TEMP/tui-data" /dev/null > "$RUNNER_TEMP/tui.out" || status=$?
          cat "$RUNNER_TEMP/tui.log" || true
          [ "$status" = 124 ] || { echo "::error::pikibun-tui ended ($status) within 10 seconds: the packaged app didn't keep running in a terminal."; exit 1; }
      # The web build in the runner's Chrome against a test-mode server: the web runtime differs from that engine (it
      # lacks `lifecycle`, and the page's Content-Security-Policy applies), and only a browser shows it.
      - run: pnpm test:client-web
      # The NSH web client into dist/client.
      - run: pnpm build
      # The published CLI, with the web app and migrations `pikibun serve` ships, and its server chunk loading.
      - run: pnpm --filter pikibun run build
      - run: node packages/cli/dist/pikibun.js serve --help

  # The sandboxes' shared rules on macOS and Windows: every file tool case through each workspace the platform has (on
  # macOS, Seatbelt itself, with sandbox-exec), and the native sandboxes' own tests.
  platforms:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx --test tests/sandbox-conformance.test.ts tests/native-sandboxes.test.ts tests/windows-cmd.test.ts tests/pi-file-tools.test.ts

  # TRUST_PROXY with forwarded requests, on the image's own Node: its health check sends no forwarded headers, so it
  # stayed healthy while every request through a TLS proxy was a 500 (#71).
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Container image builds and serves health, directly and behind a proxy
        run: |
          docker build -t pikibun:ci .
          docker run -d --name pikibun -p 8787:8787 -e APP_ORIGIN=http://127.0.0.1:8787 -e TRUST_PROXY=true \
            -e PREVIEW_ORIGIN=https://preview.pikibun.example -e SESSION_SECRET=ci-session-secret-ci-session-secret-ci -e VAULT_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=') pikibun:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"workspaceDatabasesConfigured":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordAuth":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"githubSignup":"invite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordSignup":"invite"'
          # The image's only client, NSH, at the server's own origin with its runtime policy, and at a preview origin too.
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          curl -fsSI http://127.0.0.1:8787/ | grep -qi "content-security-policy:.*'wasm-unsafe-eval'"
          curl -fsS http://127.0.0.1:8787/ | grep -q '<base href="/">'
          curl -fsSI http://127.0.0.1:8787/sw.js | grep -qi 'content-type: text/javascript'
          curl -fsSI -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: preview.pikibun.example' http://127.0.0.1:8787/ | grep -qi "content-security-policy:.*'wasm-unsafe-eval'"
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: preview.pikibun.example' http://127.0.0.1:8787/ | grep -q '<base href="/">'
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: pikibun.example' http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          docker rm -f pikibun

  # The one result: every job passed, or was skipped as the changes didn't need it.
  verify:
    needs: [changes, checks, tests, coverage, client, platforms, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended $result."; exit 1 ;;
            esac
          done
