name: CI
# Once per commit: pull requests run it on their pushes, main on its own (merges and direct pushes), and other branches
# only through a pull request or by hand (workflow_dispatch). Version tags run it through their release workflow before
# publishing, so tag pushes don't trigger it twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A pull request's newer push cancels its run in progress; every other run (main, releases, by hand) has a group of its
# own, so each of main's commits is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 git util-linux
      - name: Enable sandbox namespaces in the disposable CI VM
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --cap-drop ALL --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev -- /usr/bin/true
      - run: pnpm install --frozen-lockfile
      # The Native Shell CLI the client (apps/nsh) is built with, at the version scripts/nsh.mjs pins.
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Connector shrinkwrap matches package.json
        run: node packages/cli/scripts/shrinkwrap.mjs --check
      - run: pnpm typecheck
      # The sandbox's Python programs: Ruff and Pyright, from npm (embedded as checked by tests/sandbox-python.test.ts).
      - run: pnpm python:check
      - run: pnpm test
      # The client's tests, headless on Native Shell's own engine against a stubbed server.
      - run: pnpm test:client
      # The web build in the runner's Chrome against a test-mode server: the web runtime differs from that engine (it
      # lacks `lifecycle`, and the page's Content-Security-Policy applies), and only a browser shows it.
      - run: pnpm test:client-web
      # The production React/Electron web client under its strict script policy.
      - run: pnpm test:web
      - run: pnpm build
      # The published CLI, with the web app and migrations `pikibun serve` ships, and its server chunk loading.
      - run: pnpm --filter pikibun run build
      - run: node packages/cli/dist/pikibun.js serve --help
      - run: pnpm test:connected
      # TRUST_PROXY with forwarded requests, on the image's own Node: its health check sends no forwarded headers, so it
      # stayed healthy while every request through a TLS proxy was a 500 (#71).
      - name: Container image builds and serves health, directly and behind a proxy
        run: |
          docker build -t pikibun:ci .
          docker run -d --name pikibun -p 8787:8787 -e APP_ORIGIN=http://127.0.0.1:8787 -e TRUST_PROXY=true \
            -e PREVIEW_ORIGIN=https://preview.pikibun.example -e SESSION_SECRET=ci-session-secret-ci-session-secret-ci -e VAULT_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=') pikibun:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"workspaceDatabasesConfigured":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordAuth":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"githubSignup":"invite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordSignup":"invite"'
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          curl -fsSI http://127.0.0.1:8787/ | grep -qi "content-security-policy:.*script-src 'self';"
          curl -fsSI -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: preview.pikibun.example' http://127.0.0.1:8787/ | grep -qi "content-security-policy:.*'wasm-unsafe-eval'"
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: preview.pikibun.example' http://127.0.0.1:8787/ | grep -q '<base href="/">'
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: pikibun.example' http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          docker rm -f pikibun
          # As pikibun.com runs it (deploy-server.yml): the NSH client at the server's own origin.
          docker run -d --name pikibun -p 8787:8787 -e APP_ORIGIN=http://127.0.0.1:8787 -e STATIC_CLIENT=nsh -e STATIC_DIR=dist/preview \
            -e SESSION_SECRET=ci-session-secret-ci-session-secret-ci -e VAULT_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=') pikibun:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8787/ | grep -qi "content-security-policy:.*'wasm-unsafe-eval'"
          curl -fsS http://127.0.0.1:8787/ | grep -q '<base href="/">'
          docker rm -f pikibun
