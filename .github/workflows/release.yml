name: Release pikibun (npm)
# Pushing a cli-v1.2.3 tag (cli-v1.2.3-beta.1 for a prerelease) on a commit in main runs CI, then publishes the
# `pikibun` connector from packages/cli to npm, a prerelease to the `next` dist-tag. The tag decides the version:
# scripts/set-release-version.mjs sets it in package.json and npm-shrinkwrap.json before building, so no version bump
# needs committing first. It stamps each extension the connector bundles with that extension's latest ext-<name>-v tag
# at the release commit (its committed version if it has none), which connectors compare with the version Pikibun pins
# (managed packages, docs/design/extension-loading.md). The other release lines are in release-check.yml.
# npm auth: a trusted publisher on npmjs.com for this workflow file (release.yml, keep its name) and environment
# `release`, or an NPM_TOKEN secret.
on:
  push:
    tags: ["cli-v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/release-check.yml
    with:
      prefix: cli-

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  npm:
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history with its tags: the bundled extensions' versions are their latest ext-<name>-v tags.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # The Native Shell CLI the web app is built with, at the version scripts/nsh.mjs pins (as in ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - run: pnpm install --frozen-lockfile
      # The tag's version, in the manifest and the shrinkwrap alike (prepublishOnly checks they agree), and each bundled
      # extension's latest release; the build bundles them.
      - name: Set the connector's and its bundled extensions' versions from the tags
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION" cli
      # The web app, which the CLI ships for `pikibun serve`.
      - run: pnpm build
      # prepublishOnly checks the shrinkwrap and builds dist.
      - name: Publish pikibun
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
