name: Release app
# Pushing an app-v1.2.3 tag (app-v1.2.3-beta.1 for a prerelease) on a commit in main runs CI, then packages the client
# (apps/nsh) with Native Shell for every platform and attaches the packages to the tag's GitHub release, marked latest
# unless it is a prerelease:
#   Windows   Pikibun-<version>-windows-x64-setup.exe (Inno Setup, apps/nsh/windows/installer.iss) and a portable .zip
#   macOS     Pikibun-<version>-macos-arm64.zip, the .app
#   Linux     Pikibun-<version>-linux-x86_64.tar.gz
#   Android   Pikibun-<version>-android.apk
# and uploads iOS to TestFlight when its signing is configured. The apps' version is the tag's without a prerelease
# suffix (Apple's and Windows' version fields take only numbers) and their build number is this run's.
#
# Pull requests that change how the app is packaged build every platform too, unsigned, without releasing; so does a
# run by hand.
#
# Signing, in the `release` environment, each platform's all or nothing (unsigned, with a warning, when none is set):
# - Windows: WIN_CERTIFICATE_P12 (base64 code-signing .p12) and WIN_CERTIFICATE_PASSWORD sign Pikibun.exe and the
#   installer. Unsigned, SmartScreen warns before the first launch.
# - macOS: MAC_CERTIFICATE_P12 (base64 Developer ID Application .p12), MAC_CERTIFICATE_PASSWORD, the variable
#   MAC_SIGNING_IDENTITY (the certificate's name without "Developer ID Application: "), and for notarization
#   APP_STORE_CONNECT_API_KEY (the .p8's contents), APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID.
#   Unsigned, the app is ad hoc signed and Gatekeeper blocks it on other Macs.
# - Android: ANDROID_KEYSTORE (base64 release keystore), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Unsigned, the
#   APK has Android's debug key, and installing a later, release-signed one needs this one uninstalled first.
# - iOS: IOS_CERTIFICATE_P12 (base64 Apple Distribution .p12), IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64
#   App Store profile for com.pikibun.app) and the App Store Connect key above. Unsigned, the app is only packaged, to
#   check it builds.
on:
  push:
    tags: ["app-v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release-app.yml
      - apps/nsh/nsh.json
      - apps/nsh/icon.png
      - apps/nsh/windows/**
      - scripts/nsh.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-check.yml
    with:
      prefix: app-

  ci:
    if: github.event_name == 'push'
    needs: check
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    timeout-minutes: 30
    # The release's secrets only for a release: a pull request's build is unsigned.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        shell: bash
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Package
        run: node scripts/nsh.mjs package App.tsx --target windows --app-version $env:APP_VERSION --build $env:BUILD --out "$env:RUNNER_TEMP\app"
      - name: Signing configured
        id: signing
        env:
          WIN_CERTIFICATE_P12: ${{ secrets.WIN_CERTIFICATE_P12 != '' }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD != '' }}
        run: |
          if ($env:WIN_CERTIFICATE_P12 -eq 'true' -and $env:WIN_CERTIFICATE_PASSWORD -eq 'true') {
            "configured=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:WIN_CERTIFICATE_P12 -eq 'true' -or $env:WIN_CERTIFICATE_PASSWORD -eq 'true') {
            Write-Output "::error::Windows signing needs both WIN_CERTIFICATE_P12 and WIN_CERTIFICATE_PASSWORD."
            exit 1
          } else {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::WIN_CERTIFICATE_P12 is not set: Pikibun.exe and its installer are unsigned, so SmartScreen warns before the first launch."
          }
      - name: Sign Pikibun.exe
        if: steps.signing.outputs.configured == 'true'
        env:
          WIN_CERTIFICATE_P12: ${{ secrets.WIN_CERTIFICATE_P12 }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = "$env:RUNNER_TEMP\signing.p12"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WIN_CERTIFICATE_P12))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          & $signtool sign /f $certificate /p $env:WIN_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$env:RUNNER_TEMP\app\Pikibun\Pikibun.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release" | Out-Null
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:APP_VERSION" "/DSourceDir=$env:RUNNER_TEMP\app\Pikibun" "/DOutputDir=$env:RUNNER_TEMP\release" apps\nsh\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer
        if: steps.signing.outputs.configured == 'true'
        env:
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\signing.p12" /p $env:WIN_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$env:RUNNER_TEMP\release\Pikibun-$env:VERSION-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\signing.p12"
      # The same directory, to run from wherever it is unpacked.
      - name: Portable zip
        run: Compress-Archive -Path "$env:RUNNER_TEMP\app\Pikibun" -DestinationPath "$env:RUNNER_TEMP\release\Pikibun-$env:VERSION-windows-x64.zip"
      # As a user would, silently: installed for this user with its Start menu entry, then uninstalled without a trace.
      - name: The installer installs and uninstalls
        run: |
          $installer = "$env:RUNNER_TEMP\release\Pikibun-$env:VERSION-windows-x64-setup.exe"
          $app = "$env:LOCALAPPDATA\Programs\Pikibun"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pikibun.lnk"
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          foreach ($path in "$app\Pikibun.exe", "$app\nsh\bundle.nshc", $shortcut) {
            if (-not (Test-Path $path)) { Write-Output "::error::The installer did not install $path."; exit 1 }
          }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller removes itself last, from a copy, so give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\Pikibun.exe"); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in "$app\Pikibun.exe", $shortcut) {
            if (Test-Path $path) { Write-Output "::error::The uninstaller left $path."; exit 1 }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest # Apple silicon: Native Shell publishes its macOS CLI and runtime for arm64.
    timeout-minutes: 45
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Package
        run: |
          node scripts/nsh.mjs package App.tsx --target macos --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app"
          echo "APP=$RUNNER_TEMP/app/Pikibun.app" >> "$GITHUB_ENV"
      - name: Signing configured
        id: signing
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY != '' }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
        run: |
          missing=()
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD MAC_SIGNING_IDENTITY APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$MAC_CERTIFICATE_P12" = true ]; then
            echo "::error::MAC_CERTIFICATE_P12 is set, so signing and notarizing also need: ${missing[*]}."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAC_CERTIFICATE_P12 is not set: the macOS app is ad hoc signed and not notarized, so Gatekeeper blocks it on other Macs."
          fi
      # Developer ID with the hardened runtime, notarized, and the ticket stapled to the app so it opens offline too.
      - name: Sign and notarize
        if: steps.signing.outputs.configured == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          codesign --force --deep --options runtime --timestamp --keychain "$keychain" \
            --sign "Developer ID Application: $MAC_SIGNING_IDENTITY" "$APP"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s\n' "$API_KEY" > "$key"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/notarize.zip"
      - name: Check the signature
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$SIGNED" = true ]; then
            spctl --assess --type execute --verbose "$APP"
            xcrun stapler validate "$APP"
          fi
      # It starts, and is still running a few seconds later: signing and the hardened runtime broke nothing at launch.
      - name: The app starts
        run: |
          executable="$APP/Contents/MacOS/$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          "$executable" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Pikibun exited at launch."
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          kill "$pid"
      - name: Zip
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/release/Pikibun-$VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  linux:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      # The app's directory (the runner, its bundle, a .desktop file and the icon) as a .tar.gz.
      - name: Package
        run: |
          node scripts/nsh.mjs package App.tsx --target linux --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/app/Pikibun.tar.gz" "$RUNNER_TEMP/release/Pikibun-$VERSION-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: app-linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  android:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest # With the Android SDK (ANDROID_HOME) and a JDK, which packaging needs.
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Signing configured
        id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do [ "${!name}" = true ] || missing+=("$name"); done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq 3 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE is not set: the APK has Android's debug key, so a later, release-signed one installs only after uninstalling it."
          else
            echo "::error::Android signing is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - name: Package
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          signing=()
          if [ "$SIGNED" = true ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            signing=(--keystore "$RUNNER_TEMP/release.jks" --key-alias "$ANDROID_KEY_ALIAS")
          fi
          node scripts/nsh.mjs package App.tsx --target android --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app" "${signing[@]}"
          rm -f "$RUNNER_TEMP/release.jks"
          apk=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo "::error::nsh package wrote no APK."; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          mv "$apk" "$RUNNER_TEMP/release/Pikibun-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  # Not a release asset: an App Store build installs only through TestFlight or the App Store.
  #
  # App Store Connect takes only apps built with the current SDK (iOS 26), and NSH 0.4's prebuilt iPhone runner was
  # linked with Xcode 16.4's iOS 18.5 SDK. So the runner is built here from NSH's source at the pinned commit
  # (scripts/nsh.mjs), with this runner's Xcode, and `nsh package` takes it through NSH_RUNTIME; the rest of NSH is
  # the prebuilt release. NSH also writes none of the build keys App Store Connect requires in Info.plist (DT*, and
  # arm64 in UIRequiredDeviceCapabilities): they are added from this Xcode, and the app is signed again. Both can go
  # once an NSH release does them.
  ios:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - name: Signing configured
        id: signing
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD != '' }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
        run: |
          missing=()
          for name in IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$IOS_CERTIFICATE_P12" != true ] && [ "$IOS_PROVISIONING_PROFILE" != true ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing is not configured: the app is packaged unsigned to check it builds, and nothing goes to TestFlight."
          else
            echo "::error::iOS signing is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Install the signing certificate and profile
        if: steps.signing.outputs.configured == 'true'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n1)
          [ -n "$identity" ] || { echo "::error::IOS_CERTIFICATE_P12 holds no Apple Distribution identity."; exit 1; }
          echo "IOS_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
      - name: Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"
          echo "build=$(xcodebuild -version | awk 'NR==2{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Native Shell's source
        run: |
          version=$(node --input-type=module -e 'import { NSH_VERSION } from "./scripts/nsh.mjs"; console.log(NSH_VERSION)')
          commit=$(node --input-type=module -e 'import { NSH_COMMIT } from "./scripts/nsh.mjs"; console.log(NSH_COMMIT)')
          git clone --quiet --depth 1 --branch "$version" https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh-src"
          actual=$(git -C "$RUNNER_TEMP/nsh-src" rev-parse HEAD)
          if [ "$actual" != "$commit" ]; then
            echo "::error::NSH's $version tag is $actual, not the pinned $commit (scripts/nsh.mjs)."
            exit 1
          fi
          echo "NSH_VERSION=$version" >> "$GITHUB_ENV"
      # The build depends on the Xcode it links with, so a new one builds afresh.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nsh-src/target
          key: nsh-ios-runner-${{ hashFiles('scripts/nsh.mjs') }}-xcode-${{ steps.xcode.outputs.build }}
      - name: The iPhone runner, built with this Xcode
        run: |
          (cd "$RUNNER_TEMP/nsh-src" && cargo build --release --locked -p nsh-ios-app --target aarch64-apple-ios)
          # The prebuilt release for everything else (also downloaded by `nsh package` itself).
          node scripts/nsh.mjs --version
          runtime="$RUNNER_TEMP/nsh-runtime"
          rm -rf "$runtime"
          cp -R ".cache/nsh/$NSH_VERSION/nsh/runtime" "$runtime"
          cp "$RUNNER_TEMP/nsh-src/target/aarch64-apple-ios/release/nsh-ios-app" "$runtime/ios/iphoneos/nsh-ios-app"
          sdk=$(xcrun vtool -show-build "$runtime/ios/iphoneos/nsh-ios-app" | awk '$1 == "sdk" {print $2; exit}')
          echo "The iPhone runner is built with the iOS $sdk SDK."
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The iPhone runner was built with the iOS $sdk SDK; App Store Connect needs iOS 26 or later."
            exit 1
          fi
          echo "NSH_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Package
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          signing=()
          [ "$SIGNED" = true ] && signing=(--sign "$IOS_IDENTITY" --profile "$RUNNER_TEMP/profile.mobileprovision")
          node scripts/nsh.mjs package App.tsx --target ios --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app" "${signing[@]}"
          ls -la "$RUNNER_TEMP/app"
      # What Xcode writes and App Store Connect requires: the SDK and Xcode the app was built with, and that it is
      # 64-bit. Then the app is signed again, as `nsh package` signed it (its entitlements, from the profile), and
      # zipped again into the .ipa the way it zips one.
      - name: Complete Info.plist for App Store Connect
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
        run: |
          app="$RUNNER_TEMP/app/Pikibun.app"
          plist="$app/Info.plist"
          put() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist"
          }
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_build=$(xcrun --sdk iphoneos --show-sdk-build-version)
          IFS=. read -r major minor patch <<< "$XCODE_VERSION"
          put BuildMachineOSBuild "$(sw_vers -buildVersion)"
          put DTCompiler com.apple.compilers.llvm.clang.1_0
          put DTPlatformBuild "$sdk_build"
          put DTPlatformName iphoneos
          put DTPlatformVersion "$sdk_version"
          put DTSDKBuild "$sdk_build"
          put DTSDKName "iphoneos$sdk_version"
          put DTXcode "$(printf '%d%d%d' "$major" "${minor:-0}" "${patch:-0}")"
          put DTXcodeBuild "$XCODE_BUILD"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$plist"
          plutil -lint "$plist"
          plutil -p "$plist" | grep -E 'DT|BuildMachine|UIRequired|arm64'
          if [ "$SIGNED" != true ]; then
            exit 0
          fi
          entitlements=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.entitlements' | head -n1)
          [ -n "$entitlements" ] || { echo "::error::nsh package wrote no entitlements to sign the app again with."; exit 1; }
          codesign --force --sign "$IOS_IDENTITY" --entitlements "$entitlements" "$app"
          codesign --verify --strict --verbose=2 "$app"
          staging="$RUNNER_TEMP/ipa"
          rm -rf "$staging" "$RUNNER_TEMP/app/Pikibun.ipa"
          mkdir -p "$staging/Payload"
          ditto "$app" "$staging/Payload/Pikibun.app"
          ditto -c -k --norsrc --keepParent "$staging/Payload" "$RUNNER_TEMP/app/Pikibun.ipa"
          rm -rf "$staging"
      # Every app-v tag goes to TestFlight; submitting a build for App Store review stays manual. App Store Connect
      # takes each version's build numbers only increasing: this workflow's run number.
      - name: Upload to TestFlight
        if: steps.signing.outputs.configured == 'true' && github.event_name == 'push'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ipa=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.ipa' | head -n1)
          [ -n "$ipa" ] || { echo "::error::nsh package wrote no .ipa."; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/profile.mobileprovision"

  # One release for every platform's files; a re-run replaces them.
  github-release:
    if: github.event_name == 'push'
    needs: [check, windows, macos, linux, android]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          merge-multiple: true
          path: assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          PREVIOUS_TAG: ${{ needs.check.outputs.previous-tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          [ -n "$PREVIOUS_TAG" ] && flags+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Pikibun $VERSION" --generate-notes "${flags[@]}"
