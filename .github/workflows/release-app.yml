name: Release app
# Pushing an app-v1.2.3 tag (app-v1.2.3-beta.1 for a prerelease) on a commit in main runs CI, then packages the client
# (apps/nsh) with Native Shell for every platform and attaches the packages to the tag's GitHub release, "Pikibun
# <version>", which becomes the latest (a tag with a suffix such as -beta.1 makes a prerelease instead):
#   Windows   Pikibun-<version>-windows-x64-setup.exe (Inno Setup, apps/nsh/windows/installer.iss), signed by SignPath
#   macOS     Pikibun-<version>-macos-arm64.dmg, the .app signed with a Developer ID and both notarized
#   Linux     Pikibun-<version>-linux-x86_64.tar.gz
#   Android   Pikibun-<version>-android.apk, signed with the release key
# and uploads iOS to TestFlight when its signing is configured. The apps' version is the tag's without a prerelease
# suffix (Apple's and Windows' version fields take only numbers) and their build number is this run's.
#
# Pull requests that change how the app is packaged build every platform too, without releasing; so does a run by
# hand. They have no release secrets: Android is signed with a throwaway key made for the run, so its signing runs as a
# release's does, macOS is ad hoc signed, and Windows is unsigned.
#
# Signing, in the `release` environment, each platform's all or nothing. A tag's run fails for macOS or Android while
# its signing is not configured.
# - Windows: SignPath Foundation's free signing for open source, through SignPath.io: the secret SIGNPATH_API_TOKEN (a
#   submitter's API token) and the variable SIGNPATH_ORGANIZATION_ID, with the project `pikibun`, the signing policy
#   `release-signing` and the artifact configuration `windows-installer` (.github/signpath/windows-installer.xml;
#   the variables SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG name
#   others). SignPath signs the installer once an approver approves the request there. Pikibun.exe inside it is
#   Native Shell's prebuilt runner, which SignPath Foundation's certificate may not sign. Until SignPath is set up the
#   installer is released unsigned, with a warning.
# - macOS: MAC_CERTIFICATE_P12 (base64 Developer ID Application .p12), MAC_CERTIFICATE_PASSWORD, the variable
#   MAC_SIGNING_IDENTITY (the certificate's name without "Developer ID Application: "), and for notarization
#   APP_STORE_CONNECT_API_KEY (the .p8's contents), APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID.
# - Android: ANDROID_KEYSTORE (base64 release keystore), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Keep the
#   keystore: every later APK must be signed with it to install over this one.
# - iOS: IOS_CERTIFICATE_P12 (base64 Apple Distribution .p12), IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64
#   App Store profile for com.pikibun.app) and the App Store Connect key above. Unsigned, the app is only packaged, to
#   check it builds.
on:
  push:
    tags: ["app-v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release-app.yml
      - apps/nsh/nsh.json
      - apps/nsh/icon.png
      - apps/nsh/windows/**
      - scripts/nsh.mjs
      - scripts/app-version.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-check.yml
    with:
      prefix: app-

  ci:
    if: github.event_name == 'push'
    needs: check
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    # Long enough for a release's signing request to wait for its approval in SignPath.
    timeout-minutes: 270
    # The release's secrets only for a release: a pull request's build is unsigned.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    # SignPath downloads the unsigned installer's artifact with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signing.outputs.configured }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      # FILE_VERSION: Windows' four-part file and product version, 1.2.3.0, which SignPath checks before signing.
      - name: Version
        shell: bash
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "FILE_VERSION=${version%%-*}.0"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      # Signed through SignPath Foundation's free open-source signing (.github/signpath/windows-installer.xml) once it
      # is set up; until then a release's installer is unsigned, with a warning.
      - name: Signing configured
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -eq 'true' -and $env:SIGNPATH_ORGANIZATION_ID -eq 'true') {
            "configured=true" >> $env:GITHUB_OUTPUT
          } elseif ($env:SIGNPATH_API_TOKEN -eq 'true' -or $env:SIGNPATH_ORGANIZATION_ID -eq 'true') {
            Write-Output "::error::SignPath signing needs both the secret SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID."
            exit 1
          } else {
            "configured=false" >> $env:GITHUB_OUTPUT
            if ($env:EVENT -eq 'push') {
              Write-Output "::warning::SignPath is not set up (SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID): the Windows installer is unsigned, so SmartScreen warns before it runs."
            }
          }
      - name: Stamp the version into the app
        run: node scripts/app-version.mjs $env:VERSION
      - name: Package
        run: node scripts/nsh.mjs package App.tsx --target windows --app-version $env:APP_VERSION --build $env:BUILD --out "$env:RUNNER_TEMP\app"
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release" | Out-Null
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:FILE_VERSION" "/DSourceDir=$env:RUNNER_TEMP\app\Pikibun" "/DOutputDir=$env:RUNNER_TEMP\release" apps\nsh\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "INSTALLER=$env:RUNNER_TEMP\release\Pikibun-$env:VERSION-windows-x64-setup.exe" >> $env:GITHUB_ENV
      # What SignPath's artifact configuration requires of the file it signs. Inno Setup pads the strings of its version
      # resource with spaces to a fixed size (its Setup stub's), so they compare trimmed.
      - name: The installer's product name and version
        run: |
          $info = (Get-Item $env:INSTALLER).VersionInfo
          $name = "$($info.ProductName)".Trim()
          $version = "$($info.ProductVersion)".Trim()
          Write-Output "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($name -ne 'Pikibun' -or $version -ne $env:FILE_VERSION) {
            Write-Output "::error::The installer's product is '$name' $version, not 'Pikibun' $env:FILE_VERSION."
            exit 1
          }
      # As a user would, silently: installed for this user with its Start menu entry, then uninstalled without a trace.
      - name: The installer installs and uninstalls
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Pikibun"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Pikibun.lnk"
          Start-Process $env:INSTALLER -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          foreach ($path in "$app\Pikibun.exe", "$app\nsh\bundle.nshc", $shortcut) {
            if (-not (Test-Path $path)) { Write-Output "::error::The installer did not install $path."; exit 1 }
          }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller removes itself last, from a copy, so give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\Pikibun.exe"); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in "$app\Pikibun.exe", $shortcut) {
            if (Test-Path $path) { Write-Output "::error::The uninstaller left $path."; exit 1 }
          }
      # SignPath signs only what a GitHub-hosted run of this workflow uploaded as an artifact, and every release's
      # request waits for an approver in SignPath.
      - name: Upload the installer to sign
        id: unsigned
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer-unsigned
          path: ${{ env.INSTALLER }}
          if-no-files-found: error
      - name: Sign the installer with SignPath
        if: steps.signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pikibun' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-installer' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.FILE_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: ${{ runner.temp }}/signed
      # The signed installer in place of the unsigned one, trusted by Windows and timestamped.
      - name: Check the signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          $signed = Join-Path "$env:RUNNER_TEMP\signed" (Split-Path -Leaf $env:INSTALLER)
          if (-not (Test-Path $signed)) { Write-Output "::error::SignPath returned no $(Split-Path -Leaf $env:INSTALLER)."; exit 1 }
          Copy-Item -Force $signed $env:INSTALLER
          $signature = Get-AuthenticodeSignature $env:INSTALLER
          Write-Output "$($signature.Status): $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { Write-Output "::error::The installer's signature is not valid: $($signature.StatusMessage)"; exit 1 }
          if (-not $signature.TimeStamperCertificate) { Write-Output "::error::The installer's signature has no timestamp."; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest # Apple silicon: Native Shell publishes its macOS CLI and runtime for arm64.
    timeout-minutes: 45
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Stamp the version into the app
        run: node scripts/app-version.mjs "$VERSION"
      - name: Package
        run: |
          node scripts/nsh.mjs package App.tsx --target macos --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app"
          echo "APP=$RUNNER_TEMP/app/Pikibun.app" >> "$GITHUB_ENV"
      - name: Signing configured
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD != '' }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY != '' }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
        run: |
          missing=()
          for name in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD MAC_SIGNING_IDENTITY APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$MAC_CERTIFICATE_P12" = true ]; then
            echo "::error::MAC_CERTIFICATE_P12 is set, so signing and notarizing also need: ${missing[*]}."
            exit 1
          elif [ "$EVENT" = push ]; then
            echo "::error::A release's macOS app is signed and notarized: set ${missing[*]} in the release environment."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a release: the macOS app and its disk image are ad hoc signed and not notarized."
          fi
      # Developer ID with the hardened runtime, notarized, and the ticket stapled to the app so it opens offline too.
      - name: Sign and notarize
        if: steps.signing.outputs.configured == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          codesign --force --deep --options runtime --timestamp --keychain "$keychain" \
            --sign "Developer ID Application: $MAC_SIGNING_IDENTITY" "$APP"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s\n' "$API_KEY" > "$key"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          rm "$RUNNER_TEMP/notarize.zip"
      - name: Check the signature
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$SIGNED" = true ]; then
            spctl --assess --type execute --verbose "$APP"
            xcrun stapler validate "$APP"
          fi
      # It starts, and is still running a few seconds later: signing and the hardened runtime broke nothing at launch.
      - name: The app starts
        run: |
          executable="$APP/Contents/MacOS/$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          "$executable" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Pikibun exited at launch."
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          kill "$pid"
      # The stapled app beside a link to Applications, to drag it there.
      - name: Disk image
        run: |
          staging="$RUNNER_TEMP/dmg"
          dmg="$RUNNER_TEMP/release/Pikibun-$VERSION-macos-arm64.dmg"
          rm -rf "$staging"
          mkdir -p "$staging" "$RUNNER_TEMP/release"
          ditto "$APP" "$staging/Pikibun.app"
          ln -s /Applications "$staging/Applications"
          # hdiutil sometimes finds the runner's disk busy; it goes through on another try.
          for attempt in 1 2 3; do
            hdiutil create -volname Pikibun -srcfolder "$staging" -fs HFS+ -format UDZO -ov "$dmg" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          rm -rf "$staging"
          hdiutil verify "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      # The disk image signed and notarized too, its ticket stapled, so Gatekeeper opens it without a warning, offline too.
      - name: Sign and notarize the disk image
        if: steps.signing.outputs.configured == 'true'
        env:
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          codesign --force --timestamp --keychain "$RUNNER_TEMP/signing.keychain-db" \
            --sign "Developer ID Application: $MAC_SIGNING_IDENTITY" "$DMG"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          printf '%s\n' "$API_KEY" > "$key"
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          xcrun stapler validate "$DMG"
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/notarize.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-macos
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  linux:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Stamp the version into the app
        run: node scripts/app-version.mjs "$VERSION"
      # The app's directory (the runner, its bundle, a .desktop file and the icon) as a .tar.gz.
      - name: Package
        run: |
          node scripts/nsh.mjs package App.tsx --target linux --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/app/Pikibun.tar.gz" "$RUNNER_TEMP/release/Pikibun-$VERSION-linux-x86_64.tar.gz"
      # The layout the app's own update unpacks and swaps in (LINUX_INSTALL in apps/nsh/src/lib/update-scripts.ts).
      - name: The tarball has the app's folder as the update expects it
        run: |
          listing=$(tar -tzvf "$RUNNER_TEMP/release/Pikibun-$VERSION-linux-x86_64.tar.gz")
          echo "$listing" | awk '$NF == "Pikibun/Pikibun" && $1 ~ /^-..x/ { found = 1 } END { exit !found }' \
            || { echo "::error::The tarball has no executable Pikibun/Pikibun, which the app's update starts."; exit 1; }
          echo "$listing" | awk '$NF == "Pikibun/nsh/" { found = 1 } END { exit !found }' \
            || { echo "::error::The tarball has no Pikibun/nsh/ folder, by which the app's update knows its folder."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  android:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest # With the Android SDK (ANDROID_HOME) and a JDK, which packaging needs.
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Signing configured
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do [ "${!name}" = true ] || missing+=("$name"); done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq 3 ] && [ "$EVENT" = push ]; then
            echo "::error::A release's APK is signed with the release key: set ${missing[*]} in the release environment."
            exit 1
          elif [ ${#missing[@]} -eq 3 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a release: the APK is signed with a throwaway key."
          else
            echo "::error::Android signing is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - name: Stamp the version into the app
        run: node scripts/app-version.mjs "$VERSION"
      - name: Package
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          if [ "$SIGNED" = true ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$keystore"
            alias="$ANDROID_KEY_ALIAS"
          else
            # Not a release: a throwaway key, so the signing below runs as a release's does.
            alias=test
            NSH_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            export NSH_KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias "$alias" -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Pikibun test signing" -storepass:env NSH_KEYSTORE_PASSWORD -keypass:env NSH_KEYSTORE_PASSWORD
          fi
          expected=$(keytool -list -v -keystore "$keystore" -alias "$alias" -storepass:env NSH_KEYSTORE_PASSWORD \
            | awk '$1 == "SHA256:" && !found { print $2; found = 1 }' | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "::error::The keystore has no key $alias."; exit 1; }
          node scripts/nsh.mjs package App.tsx --target android --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app" \
            --keystore "$keystore" --key-alias "$alias"
          apk=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo "::error::nsh package wrote no APK."; exit 1; }
          # Signed with that key, not the debug one.
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          # "Signer #1 certificate SHA-256 digest: …", or by scheme, "V3.0 Signer: certificate SHA-256 digest: …".
          certificates=$("$build_tools/apksigner" verify --print-certs "$apk" 2> /dev/null)
          echo "$certificates"
          signers=$(printf '%s\n' "$certificates" | awk '/Signer.* certificate SHA-256 digest: / { print $NF }' | sort -u)
          if [ "$signers" != "$expected" ]; then
            echo "::error::The APK is signed by ${signers:-no certificate apksigner names}, not the keystore's key $alias ($expected)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          mv "$apk" "$RUNNER_TEMP/release/Pikibun-$VERSION-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-android
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  # Not a release asset: an App Store build installs only through TestFlight or the App Store.
  #
  # App Store Connect takes only apps built with the current SDK (iOS 26), and NSH's prebuilt iPhone runner (0.4's, and
  # 0.5's `ios` component) was linked with Xcode 16.4's iOS 18.5 SDK. So the runner is built here from NSH's source at the pinned commit
  # (scripts/nsh.mjs), with this runner's Xcode, and `nsh package` takes it through NSH_RUNTIME; the rest of NSH is
  # the prebuilt release. NSH also writes none of the build keys App Store Connect requires in Info.plist (DT*, and
  # arm64 in UIRequiredDeviceCapabilities), nor the export compliance answer: they are added here, and the app is
  # signed again. Both can go once an NSH release does them.
  ios:
    needs: [check, ci]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - name: Signing configured
        id: signing
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD != '' }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
        run: |
          missing=()
          for name in IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$IOS_CERTIFICATE_P12" != true ] && [ "$IOS_PROVISIONING_PROFILE" != true ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing is not configured: the app is packaged unsigned to check it builds, and nothing goes to TestFlight."
          else
            echo "::error::iOS signing is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh.mjs') }}
      - name: Version
        env:
          TAG_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version="${TAG_VERSION:-$(node -p 'require("./apps/nsh/nsh.json").version')-dev.$GITHUB_RUN_NUMBER}"
          { echo "VERSION=$version"; echo "APP_VERSION=${version%%-*}"; echo "BUILD=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_ENV"
      - name: Install the signing certificate and profile
        if: steps.signing.outputs.configured == 'true'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/distribution.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n1)
          [ -n "$identity" ] || { echo "::error::IOS_CERTIFICATE_P12 holds no Apple Distribution identity."; exit 1; }
          echo "IOS_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
      - name: Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"
          echo "build=$(xcodebuild -version | awk 'NR==2{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Native Shell's source
        run: |
          version=$(node --input-type=module -e 'import { NSH_VERSION } from "./scripts/nsh.mjs"; console.log(NSH_VERSION)')
          commit=$(node --input-type=module -e 'import { NSH_COMMIT } from "./scripts/nsh.mjs"; console.log(NSH_COMMIT)')
          git clone --quiet --depth 1 --branch "$version" https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh-src"
          actual=$(git -C "$RUNNER_TEMP/nsh-src" rev-parse HEAD)
          if [ "$actual" != "$commit" ]; then
            echo "::error::NSH's $version tag is $actual, not the pinned $commit (scripts/nsh.mjs)."
            exit 1
          fi
          echo "NSH_VERSION=$version" >> "$GITHUB_ENV"
      # The build depends on the Xcode it links with, so a new one builds afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nsh-src/target
          key: nsh-ios-runner-${{ hashFiles('scripts/nsh.mjs') }}-xcode-${{ steps.xcode.outputs.build }}
      - name: The iPhone runner, built with this Xcode
        run: |
          # Its output in a file, and on failure the end of it and the first error as an annotation: Actions' log of a
          # long cargo build comes back cut short.
          if ! (cd "$RUNNER_TEMP/nsh-src" && cargo build --release --locked --color never -p nsh-ios-app --target aarch64-apple-ios) \
            > "$RUNNER_TEMP/cargo.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/cargo.log"
            first=$(grep -m1 -A6 -E '^error' "$RUNNER_TEMP/cargo.log" | tr '\n' ' ' | cut -c1-900)
            echo "::error::Building NSH's iPhone runner failed: ${first:-see the log}"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/cargo.log"
          # The prebuilt release for everything else, with its iOS runtimes (since 0.5 the `ios` component, apart from
          # the macOS archive): pinned and checked by scripts/nsh.mjs.
          node scripts/nsh.mjs --component ios
          runtime="$RUNNER_TEMP/nsh-runtime"
          rm -rf "$runtime"
          cp -R ".cache/nsh/$NSH_VERSION/nsh/runtime" "$runtime"
          cp "$RUNNER_TEMP/nsh-src/target/aarch64-apple-ios/release/nsh-ios-app" "$runtime/ios/iphoneos/nsh-ios-app"
          sdk=$(xcrun vtool -show-build "$runtime/ios/iphoneos/nsh-ios-app" | awk '$1 == "sdk" {print $2; exit}')
          echo "The iPhone runner is built with the iOS $sdk SDK."
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The iPhone runner was built with the iOS $sdk SDK; App Store Connect needs iOS 26 or later."
            exit 1
          fi
          echo "NSH_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Stamp the version into the app
        run: node scripts/app-version.mjs "$VERSION"
      - name: Package
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          signing=()
          [ "$SIGNED" = true ] && signing=(--sign "$IOS_IDENTITY" --profile "$RUNNER_TEMP/profile.mobileprovision")
          node scripts/nsh.mjs package App.tsx --target ios --app-version "$APP_VERSION" --build "$BUILD" --out "$RUNNER_TEMP/app" "${signing[@]}"
          ls -la "$RUNNER_TEMP/app"
      # What Xcode writes and App Store Connect requires: the SDK and Xcode the app was built with, and that it is
      # 64-bit. And the export compliance answer: the app uses no encryption but the system's (HTTPS), which is
      # exempt. Without it every build waits in App Store Connect as Missing Compliance, and TestFlight's testers get
      # none until someone answers by hand (0.10.1 to 0.15.0 waited so). Then the app is signed again, as `nsh package` signed it (its entitlements, from the profile), and
      # zipped again into the .ipa the way it zips one.
      - name: Complete Info.plist for App Store Connect
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
        run: |
          app="$RUNNER_TEMP/app/Pikibun.app"
          plist="$app/Info.plist"
          put() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist"
          }
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_build=$(xcrun --sdk iphoneos --show-sdk-build-version)
          IFS=. read -r major minor patch <<< "$XCODE_VERSION"
          put BuildMachineOSBuild "$(sw_vers -buildVersion)"
          put DTCompiler com.apple.compilers.llvm.clang.1_0
          put DTPlatformBuild "$sdk_build"
          put DTPlatformName iphoneos
          put DTPlatformVersion "$sdk_version"
          put DTSDKBuild "$sdk_build"
          put DTSDKName "iphoneos$sdk_version"
          put DTXcode "$(printf '%d%d%d' "$major" "${minor:-0}" "${patch:-0}")"
          put DTXcodeBuild "$XCODE_BUILD"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"
          plutil -lint "$plist"
          plutil -p "$plist" | grep -E 'DT|BuildMachine|UIRequired|arm64|ITSAppUsesNonExemptEncryption'
          if [ "$SIGNED" != true ]; then
            exit 0
          fi
          entitlements=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.entitlements' | head -n1)
          [ -n "$entitlements" ] || { echo "::error::nsh package wrote no entitlements to sign the app again with."; exit 1; }
          codesign --force --sign "$IOS_IDENTITY" --entitlements "$entitlements" "$app"
          codesign --verify --strict --verbose=2 "$app"
          staging="$RUNNER_TEMP/ipa"
          rm -rf "$staging" "$RUNNER_TEMP/app/Pikibun.ipa"
          mkdir -p "$staging/Payload"
          ditto "$app" "$staging/Payload/Pikibun.app"
          ditto -c -k --norsrc --keepParent "$staging/Payload" "$RUNNER_TEMP/app/Pikibun.ipa"
          rm -rf "$staging"
      # Every app-v tag goes to TestFlight; submitting a build for App Store review stays manual. App Store Connect
      # takes each version's build numbers only increasing: this workflow's run number. Apple's upload service fails
      # now and then (a 504 on a file part, as app-v0.16.0's first attempt met), so the upload is tried up to three
      # times. An attempt that Apple refuses as a build it already has means an earlier one (this run's, or a re-run's
      # first run's) landed after all.
      - name: Upload to TestFlight
        if: steps.signing.outputs.configured == 'true' && github.event_name == 'push'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ipa=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.ipa' | head -n1)
          [ -n "$ipa" ] || { echo "::error::nsh package wrote no .ipa."; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          set -o pipefail
          log="$RUNNER_TEMP/altool.log"
          for attempt in 1 2 3; do
            if xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$log"; then
              exit 0
            fi
            if grep -qE 'Redundant Binary Upload|already uploaded a build' "$log"; then
              echo "::notice::App Store Connect already has build $BUILD of $APP_VERSION: an earlier upload landed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Upload attempt $attempt failed; trying again in $((attempt * 60)) seconds."
              sleep $((attempt * 60))
            fi
          done
          echo "::error::The upload to TestFlight failed three times."
          exit 1
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/profile.mobileprovision"

  # One release for every platform's files; a re-run replaces them.
  github-release:
    if: github.event_name == 'push'
    needs: [check, windows, macos, linux, android]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: app-*
          merge-multiple: true
          path: assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          PREVIOUS_TAG: ${{ needs.check.outputs.previous-tag }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # A release is the latest; only a tag with a suffix (app-v1.2.3-beta.1) makes a prerelease.
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); else flags=(--latest); fi
          [ -n "$PREVIOUS_TAG" ] && flags+=(--notes-start-tag "$PREVIOUS_TAG")
          # SignPath Foundation asks for its code signing policy on the download page; gh puts these notes before the
          # generated ones.
          if [ "$WINDOWS_SIGNED" = true ]; then
            flags+=(--notes "Windows: free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy).")
          fi
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Pikibun $VERSION" --generate-notes "${flags[@]}"
