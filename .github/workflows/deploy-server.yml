name: Deploy server
# Deploys a server image to the deployment server over SSH: release-server.yml calls this once a server-v1.2.3 release's
# image is on GHCR (prereleases aren't deployed), and running it by hand (Actions → Deploy server → Run workflow)
# deploys any published version, to redeploy or go back to one.
#
# On the server, scripts/deploy-server.sh pulls the image by digest, records it as PIKIBUN_IMAGE in the deploy
# directory's .env, recreates the pikibun service with `docker compose up -d` and waits for its health check.
#
# Configuration, in the `production` environment (README.md, "Releasing"): the variables DEPLOY_HOST, DEPLOY_USER,
# optionally DEPLOY_PORT (22), DEPLOY_PATH (pikibun, from the user's home) and DEPLOY_URL (the public origin, whose
# /api/health is checked last), and the secrets DEPLOY_SSH_KEY (a private key the server's user accepts) and
# DEPLOY_SSH_KNOWN_HOSTS (the server's host keys: ssh-keyscan -p PORT HOST, checked against the server's own). Without
# any of them nothing is deployed; with only some of them the job fails.
#
# Over Tailscale, for a server whose SSH is reachable only on its tailnet (Tailscale SSH): the secrets TS_OAUTH_CLIENT_ID
# and TS_OAUTH_SECRET (a Tailscale OAuth client with the auth_keys scope and the tag below) join the job to the tailnet
# as an ephemeral node tagged TS_TAGS (a variable, tag:ci by default), and DEPLOY_HOST is then the server's tailnet name
# or 100.x address. Tailscale SSH authenticates the node by the tailnet's SSH policy, which must `accept` (not `check`)
# that tag as DEPLOY_USER, so DEPLOY_SSH_KEY is not needed; DEPLOY_SSH_KNOWN_HOSTS still is (ssh-keyscan of the tailnet
# name from a machine on the tailnet).
on:
  workflow_call:
    inputs:
      image:
        description: The image to deploy, by digest (ghcr.io/opencara/pikibun:1.2.3@sha256:…).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The published server version to deploy, such as 1.2.3 (an image tag on GHCR).
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    # One deploy at a time; a newer release's waits for the running one instead of cancelling it mid-migration.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      # Only whether each one is set, not its value.
      - name: Deployment configured
        id: config
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST != '' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER != '' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS != '' }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          # Over Tailscale, Tailscale SSH authenticates the job's node, so no deploy key is needed.
          if [ "$TS_OAUTH_CLIENT_ID" = true ] || [ "$TS_OAUTH_SECRET" = true ]; then
            tailscale=true
            names=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET)
          else
            tailscale=false
            names=(DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS)
          fi
          missing=()
          for name in "${names[@]}"; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "tailscale=$tailscale" >> "$GITHUB_OUTPUT"
          elif [ "$tailscale" = false ] && [ ${#missing[@]} -eq ${#names[@]} ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment is not configured in the production environment: nothing was deployed."
          else
            echo "::error::Deployment is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - name: Image
        if: steps.config.outputs.configured == 'true'
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$IMAGE" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$VERSION is not a server version (1.2.3, or 1.2.3-beta.1)."
              exit 1
            fi
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          fi
          if ! [[ "$IMAGE" =~ ^[a-z0-9./_-]+(:[0-9A-Za-z._-]+)?(@sha256:[0-9a-f]{64})?$ ]]; then
            echo "::error::$IMAGE is not an image reference."
            exit 1
          fi
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      # An ephemeral node, removed from the tailnet when the job ends; the ping fails the step if the server is unreachable.
      - name: Join the tailnet
        if: steps.config.outputs.configured == 'true' && steps.config.outputs.tailscale == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: pikibun-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Deploy
        if: steps.config.outputs.configured == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'pikibun' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts"
          # Without a key (over Tailscale SSH) ssh offers none of its own: IdentitiesOnly with no -i.
          identity=(-o IdentitiesOnly=yes)
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$key")
            identity+=(-i "$key")
          fi
          ssh "${identity[@]}" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ServerAliveInterval=15 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $(printf '%q ' "$IMAGE" "$DEPLOY_PATH")" < scripts/deploy-server.sh
      - name: Public health
        if: steps.config.outputs.configured == 'true' && vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS --max-time 10 "${DEPLOY_URL%/}/api/health" && exit 0
            sleep 2
          done
          echo "::error::${DEPLOY_URL%/}/api/health did not answer after the deploy."
          exit 1
