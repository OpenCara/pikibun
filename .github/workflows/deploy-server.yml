name: Deploy server
# Deploys a server image to the deployment server over Tailscale SSH: release-server.yml calls this once a server-v1.2.3
# release's image is on GHCR (prereleases aren't deployed), and running it by hand (Actions → Deploy server → Run
# workflow) deploys any published version, to redeploy or go back to one.
#
# On the server, scripts/deploy-server.sh pulls the image by digest, records it as PIKIBUN_IMAGE in the deploy
# directory's .env, recreates the pikibun service with `docker compose up -d` and waits for its health check.
#
# The server is reached only on the tailnet (its OpenSSH is off; tailscaled serves SSH), so the job first joins the
# tailnet as an ephemeral node tagged TS_TAGS, through a Tailscale OAuth client, and the tailnet policy's ssh rules let
# that tag in as DEPLOY_USER; no SSH key is involved.
#
# Configuration, in the `production` environment (docs/development.md, "Releasing"): the variables DEPLOY_HOST (the
# server's tailnet name, nerd.tail7e2cef.ts.net), DEPLOY_USER, optionally DEPLOY_PORT (22), DEPLOY_PATH (pikibun, from
# the user's home), DEPLOY_URL (the production origin), DEPLOY_PREVIEW_URL (the NSH preview origin) and TS_TAGS (tag:ci, the OAuth
# client's tags), and the secrets TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET (a Tailscale OAuth client with the auth_keys
# write scope and TS_TAGS) and DEPLOY_SSH_KNOWN_HOSTS (the server's Tailscale SSH host keys: ssh-keyscan -p PORT HOST
# from a tailnet device, checked against the server's own). Without any of them nothing is deployed; with only some of
# them the job fails.
on:
  workflow_call:
    inputs:
      image:
        description: The image to deploy, by digest (ghcr.io/opencara/pikibun:1.2.3@sha256:…).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The published server version to deploy, such as 1.2.3 (an image tag on GHCR).
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    # One deploy at a time; a newer release's waits for the running one instead of cancelling it mid-migration.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      # Only whether each one is set, not its value.
      - name: Deployment configured
        id: config
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST != '' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER != '' }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS != '' }}
        run: |
          names=(DEPLOY_HOST DEPLOY_USER TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_SSH_KNOWN_HOSTS)
          missing=()
          for name in "${names[@]}"; do
            [ "${!name}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq ${#names[@]} ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment is not configured in the production environment: nothing was deployed."
          else
            echo "::error::Deployment is partly configured; missing: ${missing[*]}."
            exit 1
          fi
      - name: Image
        if: steps.config.outputs.configured == 'true'
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$IMAGE" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$VERSION is not a server version (1.2.3, or 1.2.3-beta.1)."
              exit 1
            fi
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          fi
          if ! [[ "$IMAGE" =~ ^[a-z0-9./_-]+(:[0-9A-Za-z._-]+)?(@sha256:[0-9a-f]{64})?$ ]]; then
            echo "::error::$IMAGE is not an image reference."
            exit 1
          fi
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.config.outputs.configured == 'true'
      # An ephemeral node: the tailnet forgets it once the job logs out (the action's post step) or goes offline.
      - name: Join the tailnet
        if: steps.config.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          hostname: github-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Deploy
        if: steps.config.outputs.configured == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'pikibun' }}
          DEPLOY_PREVIEW_URL: ${{ vars.DEPLOY_PREVIEW_URL }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          known_hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known_hosts"
          # Tailscale SSH admits the runner by its tailnet identity (the tag), not by a key.
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ServerAliveInterval=15 -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $(printf '%q ' "$IMAGE" "$DEPLOY_PATH" "$DEPLOY_PREVIEW_URL")" < scripts/deploy-server.sh
      - name: Verify production and preview clients
        if: steps.config.outputs.configured == 'true' && (vars.DEPLOY_URL != '' || vars.DEPLOY_PREVIEW_URL != '')
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_PREVIEW_URL: ${{ vars.DEPLOY_PREVIEW_URL }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
        run: node scripts/deploy-smoke.mjs
