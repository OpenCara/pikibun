name: TestFlight diagnose (temporary)
# Read-only: what App Store Connect has for com.pikibun.app's recent builds. Temporary, for the session branch.
on:
  push:
    branches: ["pikibun/testfligt-has-no-new-release-since-0-13-please-bf842e84e57b"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: pip install --quiet pyjwt cryptography requests
      - name: Query App Store Connect
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        shell: python
        run: |
          import json, os, time, jwt, requests
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["API_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             os.environ["API_KEY"], algorithm="ES256", headers={"kid": os.environ["API_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}
          B = "https://api.appstoreconnect.apple.com"
          def get(path, **params):
              r = requests.get(B + path, headers=H, params=params, timeout=60)
              print(f"\n### GET {path} {params} -> {r.status_code}")
              try:
                  return r.json()
              except Exception:
                  print(r.text[:2000]); return {}
          def show(x): print(json.dumps(x, indent=1)[:12000])
          apps = get("/v1/apps", **{"filter[bundleId]": "com.pikibun.app"})
          app = apps["data"][0]["id"]
          print("app", app, apps["data"][0]["attributes"].get("name"))
          builds = {} if True else get("/v1/builds", **{"filter[app]": app, "sort": "-uploadedDate", "limit": "15",
                       "include": "preReleaseVersion,buildBetaDetail"})
          inc = {(i["type"], i["id"]): i["attributes"] for i in builds.get("included", [])}
          for b in builds.get("data", []):
              a = b["attributes"]; rel = b["relationships"]
              pv = inc.get(("preReleaseVersions", (rel["preReleaseVersion"]["data"] or {}).get("id")), {})
              bd = inc.get(("buildBetaDetails", (rel["buildBetaDetail"]["data"] or {}).get("id")), {})
              print(json.dumps({"id": b["id"], "version": pv.get("version"), "build": a.get("version"), "uploaded": a.get("uploadedDate"),
                                "processing": a.get("processingState"), "encryption": a.get("usesNonExemptEncryption"),
                                "expired": a.get("expired"), "internal": bd.get("internalBuildState"),
                                "external": bd.get("externalBuildState"), "autoNotify": bd.get("autoNotifyEnabled")}))
          groups = {}
          for g in groups.get("data", []):
              a = g["attributes"]
              print("group", g["id"], a.get("name"), "internal" if a.get("isInternalGroup") else "external",
                    "allBuilds" if a.get("hasAccessToAllBuilds") else "")
              gb = get(f"/v1/betaGroups/{g['id']}/builds", limit="5")
              print("  builds", [x["attributes"].get("version") for x in gb.get("data", [])])
          # 0.15.0 (build 35) waits for its export compliance answer: the same as 0.13.0's, no non-exempt encryption.
          target = "88cc34a4-ead2-4939-af88-f17fc6193f95"
          r = requests.patch(f"{B}/v1/builds/{target}", headers={**H, "Content-Type": "application/json"}, timeout=60,
                             json={"data": {"type": "builds", "id": target, "attributes": {"usesNonExemptEncryption": False}}})
          print("\n### PATCH build 35 ->", r.status_code, r.text[:1500])
          time.sleep(20)
          b = get(f"/v1/builds/{target}", include="buildBetaDetail")
          print("encryption", b["data"]["attributes"].get("usesNonExemptEncryption"))
          for i in b.get("included", []):
              print("beta", i["attributes"].get("internalBuildState"), i["attributes"].get("externalBuildState"))
          gb = get("/v1/betaGroups/ed991524-69c8-48e4-9785-61edd0a64251/builds", limit="5")
          print("dev group builds", [x["attributes"].get("version") for x in gb.get("data", [])])
